<!DOCTYPE html>
<html>
        <head>
                <title>Home</title>

                <style>
                        @font-face {
                                font-family: "EBG";
                                src: url("/Users/stand/Library/Fonts/EBGaramond-VariableFont_wght.ttf");
                        }

                        body {
                                font-size: 18pt;
                                background-color: #f7eee4;
                                font-family: "EBG";
                                margin: 0;
                        }

                        #curtain {
                                position: absolute;
                                width: 100%;
                                height: 100%;
                                display: none;
                                opacity: 90%;
                        }

                        a {
                                border: 2px solid black;
                                aspect-ratio: 1 / 1;
                                background-color: #f7eee4;
                                filter: drop-shadow(5px 5px black);
                                position: absolute;
                                text-decoration: none;
                                /* width, height, positioning, border radius
                                 * done procedurally */
                        }

                        .nohover {
                                pointer-events: none;
                        }

                        a:hover {
                                filter: none;
                                z-index: 100;
                        }

                        .blueb:hover ~ #curtain {
                                display: block;
                                background-color: #77a4e3;
                        }

                        .orangeb:hover ~ #curtain {
                                display: block;
                                background-color: #ea823b;
                        }

                        .redb:hover ~ #curtain {
                                display: block;
                                background-color: #b90e0a;
                        }

                        .greenb:hover ~ #curtain {
                                display: block;
                                background-color: #466d1d;
                        }

                        .dark_blueb:hover ~ #curtain {
                                display: block;
                                background-color: #001d92;
                        }

                        .yellowb:hover ~ #curtain {
                                display: block;
                                background-color: #fada5e;
                        }

                        .purpleb:hover ~ #curtain {
                                display: block;
                                background-color: #682860;
                        }

                        span {
                                color: #1d1f21;

                                display: flex;
                                justify-content: center;

                                position: relative;
                        }
                </style>
        </head>
        <body>
                <a id="l1" href="https://www.github.com/stan-davies"><span>github</span></a>
                <a id="l2" href="https://www.youtube.com/feed/subscriptions"><span>youtube</span></a>
                <a id="l3" href="https://www.bbc.co.uk"><span>bbc</span></a>
                <a id="l4" href="https://en.cppreference.com/w/c/header.html"><span>libc</span></a>
                <a id="l5" href="https://www.ole.bris.ac.uk/ultrra/institution-page"><span>blackboard</span></a>
                <a id="l6" href="https://substack.com/@stanleydavies"><span>substack</span></a>
                <a id="l7" href="https://outlook.cloud.microsoft/mail/"><span>outlook</span></a>
                <a id="l8" class="nohover"><span></span></a>
                <a id="l9" class="nohover"><span></span></a>
                <a id="l10" class="nohover"><span></span></a>

                <div id="curtain"></div>

                <script>
                        const link_count = 10;
                        let coords = [];

                        function check_novel(crd) {
                                for (let i = 0; i < coords.length; i++) {
                                        if (coords[i][0] == crd[0] && coords[i][1] == crd[1]) {
                                                return false;
                                        }
                                }
                                return true;
                        }

                        let lii;
                        let x;
                        let y;
                        let d;
                        let valid;
                        let colours = ["blueb", "orangeb", "redb", "greenb", "dark_blueb", "yellowb", "purpleb"];
                        for (let i = 1; i <= link_count; ++i) {
                                lii = document.getElementById(`l${i}`);

                                if (Math.random() > 0.5) {
                                        d = 4.5;
                                } else {
                                        d = 6.6;
                                }
                                
                                while (true) {
                                        x = Math.floor(Math.random() * 6);
                                        y = Math.floor(Math.random() * 4);

                                        if (check_novel([x, y])) {
                                                break;
                                        }
                                }
                                coords.push([x, y]);
                                if (x < 5 && y < 3 && check_novel([x + 1, y]) && check_novel([x, y + 1]) && check_novel([x + 1, y + 1]) && Math.random() < 0.2) {
                                        d = 13;
                                        coords.push([x + 1, y]);
                                        coords.push([x, y + 1]);
                                        coords.push([x + 1, y + 1]);
                                } 
                                if (d >= 6.6 || Math.random() > 0.5) {
                                        lii.style.left  = `${5 + (90 / 6) * x}%`;
                                } else {
                                        lii.style.right = `${6 + (90 / 6) * (5 - x)}%`;
                                }

                                if (d >= 6.6 || Math.random() > 0.5) {
                                        lii.style.top   = `${5 + (90 / 4) * y}%`;
                                } else {
                                        lii.style.bottom= `${6 + (90 / 4) * (3 - y)}%`;
                                }

                                lii.style.height = `${d}em`;
                                lii.style.borderRadius = `${d / 2}em`;
                                lii.children[0].style.lineHeight = `${d}em`;

                                x = Math.floor(Math.random() * colours.length);
                                lii.classList.add(colours[x]);
                                colours.splice(x, 1);
                        }
                </script>
        </body>
</html>
